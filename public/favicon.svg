<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient (True Black OLED) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <!-- Luxury Pure Ivory/White for Serif Lettermark -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E5E5"/>
    </linearGradient>
  </defs>

  <!-- 1. ພື້ນຫຼັງ Squircle ມົນຄົມແບບ Modern App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- 2. ເສັ້ນຂອບມົນບາງນ້ອຍແບບ Clean Luxury -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#262626" stroke-width="4" opacity="0.8"/>

  <!-- 3. ສັນຍາລັກຕົວ "O" ແບບ Luxury Serif (High-Contrast Didone Curve) -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="
    M 256 120
    C 175 120 115 185 115 272
    C 115 359 175 424 256 424
    C 337 424 397 359 397 272
    C 397 185 337 120 256 120
    Z
    M 256 168
    C 285 168 316 205 316 272
    C 316 339 285 376 256 376
    C 227 376 196 339 196 272
    C 196 205 227 168 256 168
    Z
  " fill="url(#letterGrad)"/>

  <!-- 4. ຈຸດ Luxury Emerald Pearl ດ້ານເທິງ (Signature ຂອງ Le Ouve) -->
  <circle cx="256" cy="85" r="14" fill="#10B981"/>
</svg>
